# CI-пайплайн (ЛР3, варіант A).
# Запускається автоматично:
#   - при створенні / оновленні Pull Request у будь-яку гілку;
#   - при кожному push (коміті) у головну гілку main;
#   - вручну з вкладки Actions (кнопка "Run workflow").
# Результат видно у вкладці Actions на GitHub і прямо в Pull Request.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Лінтери (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Встановити ruff
        run: pip install "ruff>=0.6"
      - name: Перевірка помилок і стилю
        run: ruff check . --output-format=github
      - name: Перевірка форматування
        run: ruff format --check .

  tests:
    name: Тести (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint
    # Окрема тимчасова база PostgreSQL лише для цього запуску
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ehealth_sandbox
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ehealth_sandbox
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ehealth_sandbox -d ehealth_sandbox"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # Файлу .env.sandbox у CI немає: налаштування — змінні оточення.
    # Це тимчасова база й ключ лише для тестів, не справжні секрети.
    env:
      APP_ENV: sandbox
      DATABASE_URL: postgresql+psycopg://ehealth_sandbox:ci_password@localhost:5433/ehealth_sandbox
      SECRET_KEY: ci-only-secret-key-for-automated-tests-000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Встановити залежності
        run: pip install -r requirements-dev.txt
      - name: Запустити тести
        run: pytest -v

  docker:
    name: Docker (збирання і запуск усієї системи)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Файли налаштувань із шаблонів (лише для CI)
        run: |
          cp .env.example .env
          cp .env.sandbox.example .env.sandbox
      - name: Перевірка синтаксису docker-compose.yml
        run: docker compose config -q
      - name: Зібрати образ і підняти систему
        run: docker compose up -d --build
      - name: Дочекатися готовності застосунку
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health/db; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Перевірити API, міграції та початкові дані
        run: |
          docker compose ps -a
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/doctors | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d) >= 4, d; print(len(d), 'doctors from seed')"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq migrate)")" = "0"
      - name: Розмір образу
        run: docker image ls ehealth-booking
      - name: Логи (якщо щось пішло не так)
        if: failure()
        run: docker compose logs
      - name: Зупинити
        if: always()
        run: docker compose down -v
