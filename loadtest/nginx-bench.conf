# Nginx для тестового стенду БЕЗ Docker (ЛР6–ЛР8): той самий
# балансувальник, що й config/nginx/templates/default.conf.template, але
# репліки — це процеси uvicorn на портах 8001–8003 цієї ж машини.
#
#   for i in 1 2 3; do
#     INSTANCE_NAME=app$i APP_ENV=sandbox DEBUG=false \
#       uvicorn app.main:app --port 800$i &
#   done
#   nginx -c "$PWD/loadtest/nginx-bench.conf"      # → http://127.0.0.1:8080
#   nginx -c "$PWD/loadtest/nginx-bench.conf" -s stop
#
# Алгоритм міняється рядком у блоці upstream (least_conn; / ip_hash;).

worker_processes auto;
pid /tmp/nginx-bench.pid;
error_log /tmp/nginx-bench-error.log warn;

events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream ehealth_app {
        # least_conn;
        server 127.0.0.1:8001 max_fails=1 fail_timeout=10s;
        server 127.0.0.1:8002 max_fails=1 fail_timeout=10s;
        server 127.0.0.1:8003 max_fails=1 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://ehealth_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
