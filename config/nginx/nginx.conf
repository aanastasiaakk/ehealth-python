# ЗАПЛАНОВАНО для наступних лабораторних (балансування навантаження).
# У ЛР1 цей файл не використовується — він показує, як Nginx
# розподілятиме запити між кількома копіями бекенду FastAPI.

upstream ehealth_backend {
    least_conn;                 # запит іде тій копії, де найменше активних з'єднань
    server backend1:8000;
    server backend2:8000;
    server backend3:8000;
}

server {
    listen 80;

    location / {
        proxy_pass http://ehealth_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
