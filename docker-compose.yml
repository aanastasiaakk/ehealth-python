# Уся система e-Health Booking в Docker (ЛР5–ЛР7).
#
#   docker compose up --build        зібрати образ і підняти ВСЕ
#   docker compose up -d --build     те саме, але у фоні
#   docker compose ps                стан сервісів (healthy / exited (0))
#   docker compose logs -f app       логи застосунку
#   docker compose down              зупинити (ДАНІ БАЗ ЗБЕРІГАЮТЬСЯ в томах)
#   docker compose down -v           зупинити й ВИДАЛИТИ дані баз
#
# Вхід у систему: http://127.0.0.1:8080 → Nginx → 3 репліки app
# (порти 8000/8001 лишаються вільними для локального запуску uvicorn)
#
# Порядок запуску (depends_on + healthcheck):
#   db-sandbox (healthy) → migrate (таблиці + початкові дані, exited 0)
#   → redis (healthy) → app ×3 (healthy) → nginx
#
# Кількість реплік і алгоритм балансування (ЛР6):
#   APP_REPLICAS=2 docker compose up -d          інша кількість реплік
#   NGINX_LB=least_conn docker compose up -d     least_conn / ip_hash / round_robin
#
# Паролі баз беруться з файлу .env (шаблон .env.example), решта
# налаштувань застосунку — з .env.sandbox. У Git ці файли не потрапляють.
#
# Режим розробки з автоперезавантаженням: див. docker-compose.dev.yml

# Спільні налаштування застосунку (YAML-якір: пишемо один раз,
# використовуємо в сервісах migrate і app)
x-app-common: &app-common
  build:
    context: .
    target: runtime
  image: ehealth-booking:latest
  env_file: .env.sandbox
  environment:
    APP_ENV: sandbox
    DEBUG: "false"
    # Таблиці створює сервіс migrate, а не кожна копія застосунку
    AUTO_MIGRATE: "false"
    # У Docker база доступна за ІМ'ЯМ сервісу (db-sandbox) і внутрішнім
    # портом 5432 — через внутрішню мережу backend, а не через localhost.
    # Це значення має пріоритет над DATABASE_URL з .env.sandbox.
    DATABASE_URL: postgresql+psycopg://ehealth_sandbox:${POSTGRES_PASSWORD_SANDBOX:?Set POSTGRES_PASSWORD_SANDBOX in .env}@db-sandbox:5432/ehealth_sandbox
    # ЛР7: кеш каталогу (сервіс redis нижче)
    REDIS_URL: redis://redis:6379/0

services:
  # ---------- База даних тестового середовища ----------
  db-sandbox:
    image: postgres:16-alpine
    container_name: ehealth-db-sandbox
    # ЛР7: кожна репліка тримає до 50 з'єднань (пул 20 + 30), 3 репліки = 150.
    # Стандартних 100 з'єднань PostgreSQL на це не вистачить.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ehealth_sandbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_SANDBOX:?Set POSTGRES_PASSWORD_SANDBOX in .env}
      POSTGRES_DB: ehealth_sandbox
    ports:
      # Доступ з Mac лише для локальної розробки (uvicorn, pytest).
      # 127.0.0.1 — порт відкритий тільки на цьому комп'ютері, не в мережу.
      - "127.0.0.1:5433:5432"
    volumes:
      # Том Docker: дані лежать ПОЗА контейнером і переживають
      # docker compose down, перезапуск і навіть видалення контейнера
      - pgdata-sandbox:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehealth_sandbox -d ehealth_sandbox"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- База даних робочого середовища (ЛР3) ----------
  db-production:
    image: postgres:16-alpine
    container_name: ehealth-db-production
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ehealth_prod
      # Без пароля в .env контейнер не запуститься (немає значення за замовчуванням)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PROD:?Set POSTGRES_PASSWORD_PROD in .env}
      POSTGRES_DB: ehealth_production
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata-production:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehealth_prod -d ehealth_production"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Redis: кеш каталогу (ЛР7) ----------
  redis:
    image: redis:7-alpine
    # Лише кеш: без збереження на диск, максимум 64 МБ, при заповненні
    # витісняються найдавніші ключі (LRU)
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------- Одноразовий крок: міграції + початкові дані ----------
  migrate:
    <<: *app-common
    command: ["sh", "-c", "python -m scripts.migrate && python -m scripts.seed"]
    depends_on:
      db-sandbox:
        condition: service_healthy   # чекаємо, поки база реально готова
    networks: [backend]
    restart: "no"

  # ---------- Бекенд FastAPI: кілька однакових реплік (ЛР6) ----------
  app:
    <<: *app-common
    deploy:
      # Скільки однакових копій застосунку запустити. Кожна — окремий
      # контейнер зі своїм hostname (його видно в /health і X-Instance)
      replicas: ${APP_REPLICAS:-3}
    depends_on:
      db-sandbox:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully   # міграції пройшли без помилок
      redis:
        condition: service_healthy
    # Порт НЕ публікується на Mac: три репліки не можуть зайняти один
    # порт 8080. Ззовні до них можна дістатися лише через Nginx.
    expose:
      - "8000"
    # backend — для бази, frontend — для запитів від Nginx
    networks: [backend, frontend]
    restart: unless-stopped

  # ---------- Nginx: балансувальник навантаження (ЛР6) ----------
  nginx:
    image: nginx:1.28-alpine
    environment:
      # Алгоритм: round_robin (за замовчуванням), least_conn, ip_hash
      NGINX_LB: ${NGINX_LB:-round_robin}
      # Підставляти в шаблон лише змінні з префіксом NGINX_
      NGINX_ENVSUBST_FILTER: "^NGINX_"
    volumes:
      - ./config/nginx/templates:/etc/nginx/templates:ro
      - ./config/nginx/lb:/etc/nginx/lb:ro
    ports:
      - "8080:80"   # єдина точка входу в систему
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 5

# Внутрішні мережі: сервіси знаходять один одного за іменами
# (db-sandbox, app). База під'єднана лише до backend, Nginx — лише до
# frontend: з балансувальника до бази дістатися неможливо.
networks:
  backend:
  frontend:

volumes:
  pgdata-sandbox:
  pgdata-production:
